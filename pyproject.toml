[project]
name = "f1-optimizer"
version = "0.1.0"
description = "Formula 1 Race Strategy & Performance Optimization using MILP and Goal Programming"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pulp>=2.8.0,<3",
    "pydantic>=2.9.0",
    "scipy>=1.13.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
